appId: com.github.GitHubClient
extraMetadata:
  name: GithubDesktopLinux
# productName below is intentionally the fork name (was "GitHub Desktop"
# in upstream). It drives the .desktop file's Name + StartupWMClass and
# the binary's own WM class, so renaming it makes the GNOME shell happy
# (dash shows it, "Show Applications" lists it under the right name).
productName: GitHub Desktop Linux
linux:
  executableName: GithubDesktopLinux
  category: Development
  maintainer: GitHub Desktop Linux Fork
  protocols:
    - name: GitHub Desktop
      schemes:
        - x-github-desktop-auth
        - x-github-desktop-dev-auth
        - x-github-client
  vendor: GitHub, Inc.
  synopsis: Simple collaboration from your desktop
  description: GitHub Desktop is an open source Electron-based GitHub app written in TypeScript and React.
  target:
    - target: deb
      arch: x64
    - target: AppImage
      arch: x64
    - target: snap
      arch: x64
    - target: flatpak
      arch: x64
  icon: app/static/linux/icon-logo.png
directories:
  output: dist
deb:
  priority: optional
  depends:
    - libsecret-1-0
    - git
appImage:
  artifactName: GithubDesktopLinux-${version}.AppImage
snap:
  summary: Simple collaboration from your desktop
  grade: stable
  confinement: classic
  plugs:
    - default
    - removable-media
    - password-manager-service
flatpak:
  runtime: org.freedesktop.Platform
  runtimeVersion: "23.08"
  sdk: org.freedesktop.Sdk
  base: org.electronjs.Electron2.BaseApp
  baseVersion: "23.08"
  finishArgs:
    - --share=ipc
    - --socket=x11
    - --socket=wayland
    - --socket=pulseaudio
    - --share=network
    - --device=dri
    - --filesystem=host
    - --talk-name=org.freedesktop.secrets
    - --talk-name=org.gnome.keyring.SystemPrompter
