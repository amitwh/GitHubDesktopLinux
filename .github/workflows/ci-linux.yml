name: CI — Linux

on:
  push:
    branches:
      - feat/linux-port
  pull_request:
    branches:
      - feat/linux-port

env:
  NODE_VERSION: 24.15.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_CHANNEL: development
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libgconf-2-4
      - run: yarn
      - run: yarn validate-electron-version
      - run: yarn lint
      - run: yarn validate-changelog
      - name: Ensure a clean working directory
        run: git diff --name-status --exit-code

  build:
    name: Build — Ubuntu
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      RELEASE_CHANNEL: development
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libgconf-2-4
      - run: yarn
      - name: Build production app
        run: yarn build:prod
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
      - name: Prepare testing environment
        run: yarn test:setup
      - name: Run unit tests
        run: yarn test:unit
      - name: Run script tests
        run: yarn test:script
      - name: Run desktop-trampoline tests
        run: |
          cd vendor/desktop-trampoline
          yarn install
          yarn test
      - name: Package production app (Linux)
        run: yarn package
